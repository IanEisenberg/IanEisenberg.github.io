  <title>Contact - Ian Eisenberg</title>
  <meta charset="utf-8">

    rel="stylesheet">

  <link rel="stylesheet" href="css/bootstrap.css">

  <link rel="stylesheet" href="css/owl.carousel.min.css">

<body>

  <div class="site-wrap">
    <!--Navigation bar-->
    <a href="#" class="offcanvas-toggle js-offcanvas-toggle">Menu</a>
    <div id="nav-placeholder"> </div>
    <script>
      $("#nav-placeholder").load(
        "nav.html",
        "",
        function(){
          path = window.location.pathname.substring(1)
          $(`a[href$="${path}"]`).parent().addClass('active')
        }
      );
    </script>
    <!--end of Navigation bar-->
    <aside style="background-image: url(img/profile_big.jpg);"></aside>
    <main>
      <h1 class="mb-4">Get in Touch</h1>
      <p class="mb-4">I'd love to hear from you. If you're working on frontier AI safety, evaluation, measurement, or governance, I'd especially like to hear from you. Or if you want to collaborate on research or just say hello, feel free to reach out.</p>

      <p class="mb-5">
        <a href="https://www.linkedin.com/in/ian-eisenberg-aa17b594/" class="mr-3 fa fa-linkedin fa-2x"></a>
        <a href="https://twitter.com/Ian_Eisenberg" class="mr-3 fa fa-twitter fa-2x"></a>
        <a href="https://scholar.google.com/citations?user=K--e-R4AAAAJ&hl=en" class="mr-3 ai ai-google-scholar ai-2x"></a>
        <a href="https://github.com/IanEisenberg" class="mr-3 fa fa-github fa-2x"></a>
        <a href="https://www.instagram.com/ianweisenberg/" class="mr-3 fa fa-instagram fa-2x"></a>
      </p>

      <form class="contact-form fade-in" id="contact-form" action="https://docs.google.com/forms/d/e/1FAIpQLSeCHAQWcjh4BvSUpt6UZLGun6pru5c5IhKR7Rmko5Q7i8tTWw/formResponse" method="POST" target="hidden_iframe">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="entry.2005620554" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="entry.1045781291" required>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="entry.839337160" required></textarea>
        </div>
        <button type="submit" id="submit-btn">Send Message</button>
        <p class="form-success" style="display:none; color:#2ecc71; margin-top:1rem;">Thanks! Your message has been sent.</p>
      </form>
      <iframe name="hidden_iframe" style="display:none;"></iframe>
    </main>
  </div>

  <!-- loader -->
  <div id="loader" class="show fullscreen"><svg class="circular" width="48px" height="48px">
      <circle class="path-bg" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke="#eeeeee" />
      <circle class="path" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke-miterlimit="10"
        stroke="#f4b214" />
    </svg></div>

  <script src="js/jquery-3.2.1.min.js"></script>
  <script src="js/popper.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/owl.carousel.min.js"></script>
  <script src="js/jquery.waypoints.min.js"></script>
  <script src="js/jquery.countdown.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var fadeElements = document.querySelectorAll('.fade-in');
      setTimeout(function() {
        fadeElements.forEach(function(el) { el.classList.add('visible'); });
      }, 100);

      // Handle form submission
      var form = document.getElementById('contact-form');
      var btn = document.getElementById('submit-btn');
      var success = document.querySelector('.form-success');

      form.addEventListener('submit', function() {
        btn.textContent = 'Sending...';
        btn.disabled = true;

        // Show success after short delay (iframe submission)
        setTimeout(function() {
          btn.style.display = 'none';
          success.style.display = 'block';
          form.reset();
        }, 1000);
      });
    });
  </script>

</body>

</html>
